name: Source SBOM V1

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/generate_source_sbom_v1.py"
      - "tests/test_generate_source_sbom_v1.py"
      - "docs/SOURCE_SBOM_V1.md"
      - ".github/workflows/source-sbom-v1.yml"
  pull_request:
    paths:
      - "scripts/generate_source_sbom_v1.py"
      - "tests/test_generate_source_sbom_v1.py"
      - "docs/SOURCE_SBOM_V1.md"
      - ".github/workflows/source-sbom-v1.yml"

permissions:
  contents: read

concurrency:
  group: source-sbom-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-sbom-v1:
    name: validate-source-sbom-v1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf 'subject_commit=%s\n' "$ACTUAL_SHA"

      - name: Run source SBOM regression tests
        run: python3 -m unittest -v tests.test_generate_source_sbom_v1

      - name: Generate source SBOM and license evidence
        run: |
          python3 scripts/generate_source_sbom_v1.py \
            --sbom ci/reports/source-sbom/bom.cdx.json \
            --licenses ci/reports/source-sbom/license-evidence.json \
            --receipt ci/reports/source-sbom/receipt.json

      - name: Verify deterministic regeneration
        run: |
          mkdir -p /tmp/source-sbom-second
          python3 scripts/generate_source_sbom_v1.py \
            --sbom /tmp/source-sbom-second/bom.cdx.json \
            --licenses /tmp/source-sbom-second/license-evidence.json \
            --receipt /tmp/source-sbom-second/receipt.json
          cmp ci/reports/source-sbom/bom.cdx.json /tmp/source-sbom-second/bom.cdx.json
          cmp ci/reports/source-sbom/license-evidence.json /tmp/source-sbom-second/license-evidence.json
          cmp ci/reports/source-sbom/receipt.json /tmp/source-sbom-second/receipt.json

      - name: Enforce source-only claim boundary and subject identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          bom = json.loads(Path('ci/reports/source-sbom/bom.cdx.json').read_text())
          lic = json.loads(Path('ci/reports/source-sbom/license-evidence.json').read_text())
          receipt = json.loads(Path('ci/reports/source-sbom/receipt.json').read_text())
          assert bom['bomFormat'] == 'CycloneDX'
          assert bom['specVersion'] == '1.7'
          assert receipt['repository_commit'] == os.environ['EXPECTED_SHA']
          assert receipt['scope'] == 'SOURCE_INVENTORY_ONLY'
          assert receipt['claim_allowed'] is False
          assert lic['claim_allowed'] is False
          assert receipt['tracked_file_count'] == len(bom['components'])
          print(json.dumps({
              'repository_commit': receipt['repository_commit'],
              'tracked_file_count': receipt['tracked_file_count'],
              'tracked_bytes': receipt['tracked_bytes'],
              'source_set_hash': receipt['source_set_hash'],
              'root_license_state': lic['root_license_state'],
          }, sort_keys=True))
          PY

      - name: Upload source SBOM receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-sbom-v1-${{ github.run_id }}
          path: ci/reports/source-sbom/
          if-no-files-found: error
