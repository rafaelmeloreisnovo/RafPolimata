name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  semantic-coherence:
    name: Semantic coherence and falsifiability gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical coherence protocol
        run: python3 scripts/validate_coherence_protocol.py

      - name: Validate two-cycle omega protocol
        run: python3 scripts/validate_two_cycle_omega.py

      - name: Host C syntax check
        run: bash RAF_host_syntax_check.sh

      - name: Build compiler (strict warnings)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            raf_main.c raf_frontend.c raf_cpu.c raf_asm_emit.c raf_precomp.c \
            -o raf_compile

      - name: Smoke test compiler
        run: |
          ./raf_compile --help
          ./raf_compile raf_main.c ci_out

      - name: Validate operational manifest
        run: bash scripts/test_ops_manifest.sh

      - name: Audit repository structure
        run: python3 scripts/audit_repository_structure.py --depth 5

      - name: Emit repository universe matrix
        run: |
          python3 scripts/emit_repository_universe_matrix.py
          test -s results/repository_universe_matrix.json

      - name: Emit RAF methods status
        run: |
          python3 scripts/emit_raf_methods_status.py
          test -s results/raf_methods_status.json

      - name: Emit concept structural audit
        run: |
          python3 scripts/emit_concept_structural_audit.py
          test -s results/concept_structural_audit.json
          test -s docs/CONCEPT_STRUCTURAL_AUDIT.md

      - name: Validate Android ABI plan
        run: bash scripts/android_build_matrix.sh --plan

      - name: Audit ApkC freestanding invariants
        run: bash scripts/ci_freestanding_audit.sh

      - name: RAF TraceBuf freestanding smoke gate
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -ffreestanding -fno-builtin -fno-stack-protector \
            -fvisibility=hidden -Os -I. \
            tools/raf_tracebuf_smoke.c \
            -o build_raf_tracebuf_smoke
          ./build_raf_tracebuf_smoke

      - name: ARM64 encoder golden tests
        run: python3 tests/test_arm64_encoders.py

      - name: ARM32 encoder golden tests (L5 mnemonic coverage)
        run: python3 tests/test_arm32_encoders.py

      - name: APKc assembler roundtrip smoke test
        run: sh tests/test_asm_roundtrip.sh

      - name: ApkC compile transcript (F1 chain-of-custody)
        run: |
          mkdir -p Apkc/proofs/out
          gcc -std=c11 -O2 -Wall -Wextra \
            -target aarch64-linux-gnu -nostdlib -ffreestanding -I Apkc \
            -fsyntax-only Apkc/apkc.c 2>&1 | tee Apkc/proofs/out/apkc-compile.txt || true
          # Also record host-native compile (for CI runners without cross-compiler)
          gcc -std=c11 -O2 -Wall -I Apkc Apkc/apkc.c -o apkc_host 2>&1 \
            | tee -a Apkc/proofs/out/apkc-compile.txt || true
          echo "F1: apkc-compile.txt generated ($(wc -l < Apkc/proofs/out/apkc-compile.txt) lines)"

      - name: Validate ApkC proof protocol
        run: bash scripts/apkc_validate.sh

      - name: ApkC language coverage (asm + script modes)
        run: bash scripts/apkc_lang_coverage.sh

      - name: ApkC API/ABI matrix (minSdkVersion proof in binary AXML)
        run: bash scripts/apkc_api_abi_matrix.sh

      - name: Build and smoke-test verbovivo (T7 toroid + Fiber-H engine)
        run: |
          gcc -std=c11 -O2 -I. -IBenchmark -DVERBOVIVO_MAIN \
            rafaelia/verbovivo.c rafaelia/fiber_relmat.c -lm -o verbovivo_ci
          echo 'RAFAELIA test vector' | ./verbovivo_ci /dev/stdin /dev/null 2>&1 | \
            grep -E 'verbovivo:.*phi=' || true
          ls -la Apkc/hello.apk 2>/dev/null && \
            ./verbovivo_ci Apkc/hello.apk /dev/null 2>&1 | \
            grep -E 'verbovivo:.*phi=' || echo 'TOKEN_VAZIO: hello.apk ausente'
          echo 'RAFAELIA relmat smoke test' | ./verbovivo_ci -s -m < /dev/stdin > /dev/null 2>&1 || true
          # A4/B4: SVG engram gate — validate verbovivo produces SVG output
          mkdir -p ci/reports
          echo 'SVG gate test vector for engram' | ./verbovivo_ci -s > ci/reports/engram.svg 2>&1 || true
          grep -q '<svg' ci/reports/engram.svg && echo 'SVG gate: PASS' \
            || echo 'SVG gate: TOKEN_VAZIO (verbovivo -s did not produce SVG — check verbovivo.c)'

      - name: Coherence phi_fst golden tests (C1-C6, Item C)
        run: |
          gcc -std=c11 -I. tests/test_coherence_phi.c -o build_coherence_phi
          ./build_coherence_phi

      - name: verbovivo golden unit tests (V1-V7, Item D)
        run: |
          gcc -std=c11 -O2 -I. -IBenchmark \
            tests/test_verbovivo.c rafaelia/verbovivo.c rafaelia/fiber_relmat.c \
            -lm -o build_verbovivo_test
          ./build_verbovivo_test

      - name: Runtime router CI gate (7 cases, Item E)
        run: python3 tests/test_runtime_router.py

      - name: Codegen equivalence-family test (deterministic multi-encoding MOV family)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            tools/raf_codegen_select_test.c -o build_codegen_select_test
          ./build_codegen_select_test

      - name: Bus throughput test (S23)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -IBenchmark \
            Benchmark/raf_bus_throughput_test.c -o build_bus_throughput_test
          ./build_bus_throughput_test
          gcc -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -IBenchmark \
            Benchmark/raf_bus_throughput_benchmark.c -o build_bus_throughput_benchmark
          ./build_bus_throughput_benchmark

      - name: Science Learning Engine dry-run (syntax + import check)
        run: |
          python3 -c "import scripts.science_learning_engine as sle; print('import OK')" 2>/dev/null \
            || python3 scripts/science_learning_engine.py --dry-run --domains physics --query "test" --max-per-stage 1 \
            || echo 'SLE: dry-run skipped (network unavailable in CI)'

      - name: Processing-per-watt proxy (S25, TOKEN_VAZIO allowed)
        run: bash scripts/raf_watt_proxy_probe.sh

      - name: Upload watt-proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watt-proxy-report
          path: ci/reports/watt-proxy.md
          if-no-files-found: warn

      - name: Falsificabilidade P(k) — gate automático (A9)
        run: |
          python3 scripts/first_test_pk.py \
            --data data/pk_observado.csv \
            --output results/first_test_report.json
          echo "P(k) RRMSE gate: PASS"

      - name: Try ApkC debug signing proof (TOKEN_VAZIO allowed)
        run: bash scripts/apkc_sign_debug.sh

      - name: Upload ApkC proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkc-proofs-out
          path: Apkc/proofs/out/
          if-no-files-found: warn

      - name: Upload clean-proof-run snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkc-proof-runs
          path: Apkc/proofs/runs/
          if-no-files-found: warn

      - name: Generate P(k) falsifiability report
        run: |
          python3 scripts/first_test_pk.py --output results/first_test_report.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('results/first_test_report.json').read_text(encoding='utf-8'))
          verdict = report['verdict']
          assert verdict in {'PASS', 'FAIL'}
          print('P(k) verdict:', verdict)
          if verdict == 'FAIL':
              raise SystemExit('P(k) gate FAIL')
          PY
