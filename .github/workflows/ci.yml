name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  semantic-coherence:
    name: Semantic coherence and falsifiability gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical coherence protocol
        run: python3 scripts/validate_coherence_protocol.py

      - name: Validate two-cycle omega protocol
        run: python3 scripts/validate_two_cycle_omega.py

      - name: Host C syntax check
        run: bash RAF_host_syntax_check.sh

      - name: Build compiler (strict warnings)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            raf_main.c raf_frontend.c raf_cpu.c raf_asm_emit.c raf_precomp.c \
            -o raf_compile

      - name: Smoke test compiler
        run: |
          ./raf_compile --help
          ./raf_compile raf_main.c ci_out

      - name: Validate operational manifest
        run: bash scripts/test_ops_manifest.sh

      - name: Audit repository structure
        run: python3 scripts/audit_repository_structure.py --depth 5

      - name: Validate Android ABI plan
        run: bash scripts/android_build_matrix.sh --plan

      - name: Audit ApkC freestanding invariants
        run: bash scripts/ci_freestanding_audit.sh

      - name: Validate ApkC proof protocol
        run: bash scripts/apkc_validate.sh

      - name: ApkC language coverage (asm + script modes)
        run: bash scripts/apkc_lang_coverage.sh

      - name: Build and smoke-test verbovivo (T7 toroid + Fiber-H engine)
        run: |
          gcc -std=c11 -O2 -I. -IBenchmark -DVERBOVIVO_MAIN \
            rafaelia/verbovivo.c -lm -o verbovivo_ci
          echo 'RAFAELIA test vector' | ./verbovivo_ci /dev/stdin /dev/null 2>&1 | \
            grep -E 'verbovivo:.*phi=' || true
          ls -la Apkc/hello.apk 2>/dev/null && \
            ./verbovivo_ci Apkc/hello.apk /dev/null 2>&1 | \
            grep -E 'verbovivo:.*phi=' || echo 'TOKEN_VAZIO: hello.apk ausente'

      - name: Try ApkC debug signing proof (TOKEN_VAZIO allowed)
        run: bash scripts/apkc_sign_debug.sh

      - name: Upload ApkC proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkc-proofs-out
          path: Apkc/proofs/out/
          if-no-files-found: warn

      - name: Generate P(k) falsifiability report
        run: |
          python3 scripts/first_test_pk.py --output results/first_test_report.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('results/first_test_report.json').read_text(encoding='utf-8'))
          verdict = report['verdict']
          assert verdict in {'PASS', 'FAIL'}
          print('P(k) verdict:', verdict)
          if verdict == 'FAIL':
              raise SystemExit('P(k) gate FAIL')
          PY
