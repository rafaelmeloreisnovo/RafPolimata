name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rafpolimata-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-coherence:
    name: Semantic coherence and falsifiability gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RAF Hash Fabric source-contract binding gate
        run: make -C native/raf_hash_fabric_v1 source-contract-check

      - name: RAF Hash Fabric one-bit mutation rejection
        shell: bash
        run: |
          set -euo pipefail
          module='native/raf_hash_fabric_v1'
          for rel in README.md LICENSE.md LICENSE_SCOPE_V1.json; do
            path="$module/$rel"
            backup="$(mktemp)"
            cp "$path" "$backup"
            python3 - "$path" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          data = bytearray(p.read_bytes())
          if not data:
              raise SystemExit('cannot flip a bit in an empty file')
          data[0] ^= 0x01
          p.write_bytes(data)
          PY
            if make -C "$module" source-contract-check; then
              echo "SOURCE_CONTRACT_NEGATIVE_FAIL: one-bit mutation was accepted for $rel"
              cp "$backup" "$path"
              rm -f "$backup"
              exit 1
            fi
            cp "$backup" "$path"
            rm -f "$backup"
            make -C "$module" source-contract-check
            echo "SOURCE_CONTRACT_NEGATIVE_PASS: one-bit mutation rejected for $rel"
          done

      - name: Validate canonical coherence protocol
        run: python3 scripts/validate_coherence_protocol.py

      - name: Validate TOKEN_VAZIO gates (Hotfix H1)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_validate_token_vazio_gates

          BASE_SHA="$PR_BASE_SHA"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            BASE_SHA="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "TOKEN_VAZIO diff base: $BASE_SHA"
          python3 tools/validate_token_vazio_gates.py \
            --repo . \
            --changed-since "$BASE_SHA" \
            --output ci/reports/token-vazio-validation.json \
            --summary --strict

      - name: Validate two-cycle omega protocol
        run: python3 scripts/validate_two_cycle_omega.py

      - name: Host C syntax check
        run: bash RAF_host_syntax_check.sh

      - name: Validate complete compiler-station inventory
        run: python3 scripts/validate_compiler_station_contract.py

      - name: Build compiler with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            raf_main.c raf_frontend.c raf_cpu.c raf_asm_emit.c raf_precomp.c \
            -o raf_compile

      - name: Smoke test transactional source-dependent compiler
        run: |
          ./raf_compile --help
          ./raf_compile tests/fixtures/raf_return_42.c ci_out --native
          test -s ci_out.bin
          test -s ci_out.ops
          grep -qx 'ops_schema=4' ci_out.ops
          grep -qx 'transaction_state=COMMITTED' ci_out.ops
          grep -qx 'ir_value=42' ci_out.ops
          python3 scripts/validate_ops_manifest.py ci_out.ops --expect-rollback 0

      - name: Validate operational manifests and deterministic replay
        run: bash scripts/test_ops_manifest.sh

      - name: Audit M063 and complete APKc HOTFIX station
        run: |
          bash scripts/ci_freestanding_audit.sh
          bash scripts/audit_language_freestanding_contract.sh

      - name: Audit repository structure
        run: python3 scripts/audit_repository_structure.py --depth 5

      - name: Emit repository universe matrix
        run: |
          python3 scripts/emit_repository_universe_matrix.py
          test -s results/repository_universe_matrix.json

      - name: Emit RAF methods status
        run: |
          python3 scripts/emit_raf_methods_status.py
          test -s results/raf_methods_status.json

      - name: Emit concept structural audit
        run: |
          python3 scripts/emit_concept_structural_audit.py
          test -s results/concept_structural_audit.json
          test -s docs/CONCEPT_STRUCTURAL_AUDIT.md

      - name: Validate Android ABI plan
        run: bash scripts/android_build_matrix.sh --plan

      - name: RAF TraceBuf freestanding smoke gate
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -ffreestanding -fno-builtin -fno-stack-protector \
            -fvisibility=hidden -Os -I. \
            tools/raf_tracebuf_smoke.c \
            -o build_raf_tracebuf_smoke
          ./build_raf_tracebuf_smoke

      - name: ARM64 encoder golden tests
        run: python3 tests/test_arm64_encoders.py

      - name: ARM32 encoder golden tests
        run: python3 tests/test_arm32_encoders.py

      - name: APKc assembler roundtrip smoke test
        run: sh tests/test_asm_roundtrip.sh

      - name: APKc raw-source anti-bypass gate
        run: |
          set -o pipefail
          python3 tests/test_apkc_raw_source_gate.py
          python3 scripts/audit_apkc_raw_source_paths.py | tee Apkc/proofs/out/raw-source-gate.json

      - name: APKc compile transcript — F1 chain of custody
        run: |
          set -o pipefail
          mkdir -p Apkc/proofs/out
          make apkc-hardened-source 2>&1 | tee Apkc/proofs/out/apkc-source-cap-ci.txt
          python3 scripts/verify_apkc_source_cap_output.py build/generated/Apkc/apkc.source-cap-hardened.c
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -target aarch64-linux-gnu -nostdlib -nostdinc -ffreestanding -I Apkc \
            -fsyntax-only build/generated/Apkc/apkc.source-cap-hardened.c \
            2>&1 | tee Apkc/proofs/out/apkc-compile.txt
          echo "F1: hardened apkc-compile.txt generated ($(wc -l < Apkc/proofs/out/apkc-compile.txt) lines)"

      - name: Runtime Doctor coherence gate
        run: python3 scripts/runtime_doctor_coherence_gate.py

      - name: Validate APKc proof protocol
        run: bash scripts/apkc_validate.sh

      - name: APKc language coverage
        run: bash scripts/apkc_lang_coverage.sh

      - name: APKc API and ABI matrix
        run: bash scripts/apkc_api_abi_matrix.sh

      - name: Build and smoke-test verbovivo
        run: |
          gcc -std=c11 -O2 -I. -IBenchmark -DVERBOVIVO_MAIN \
            rafaelia/verbovivo.c rafaelia/fiber_relmat.c -lm -o verbovivo_ci
          echo 'RAFAELIA test vector' | ./verbovivo_ci /dev/stdin /dev/null 2>&1 | \
            grep -E 'verbovivo:.*phi=' || true
          ls -la Apkc/hello.apk 2>/dev/null && \
            ./verbovivo_ci Apkc/hello.apk /dev/null 2>&1 | \
            grep -E 'verbovivo:.*phi=' || echo 'TOKEN_VAZIO: hello.apk ausente'
          echo 'RAFAELIA relmat smoke test' | ./verbovivo_ci -s -m < /dev/stdin > /dev/null 2>&1 || true
          mkdir -p ci/reports
          echo 'SVG gate test vector for engram' | ./verbovivo_ci -s > ci/reports/engram.svg 2>&1 || true
          grep -q '<svg' ci/reports/engram.svg && echo 'SVG gate: PASS' \
            || echo 'SVG gate: TOKEN_VAZIO (verbovivo -s did not produce SVG)'

      - name: Coherence phi_fst golden tests (C1-C6, Item C)
        run: |
          gcc -std=c11 -I. tests/test_coherence_phi.c -o build_coherence_phi
          ./build_coherence_phi

      - name: verbovivo golden unit tests (V1-V7, Item D)
        run: |
          gcc -std=c11 -O2 -I. -IBenchmark \
            tests/test_verbovivo.c rafaelia/verbovivo.c rafaelia/fiber_relmat.c \
            -lm -o build_verbovivo_test
          ./build_verbovivo_test

      - name: Runtime router CI gate (7 cases, Item E)
        run: python3 tests/test_runtime_router.py

      - name: Codegen equivalence-family test (deterministic multi-encoding MOV family)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            tools/raf_codegen_select_test.c -o build_codegen_select_test
          ./build_codegen_select_test

      - name: Bus throughput test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -IBenchmark \
            Benchmark/raf_bus_throughput_test.c -o build_bus_throughput_test
          ./build_bus_throughput_test
          gcc -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -IBenchmark \
            Benchmark/raf_bus_throughput_benchmark.c -o build_bus_throughput_benchmark
          ./build_bus_throughput_benchmark

      - name: Science Learning Engine dry-run (syntax + import check)
        run: |
          python3 -c "import scripts.science_learning_engine as sle; print('import OK')" 2>/dev/null \
            || python3 scripts/science_learning_engine.py --dry-run --domains physics --query "test" --max-per-stage 1 \
            || echo 'SLE: dry-run skipped (network unavailable in CI)'

      - name: Processing-per-watt proxy (S25, TOKEN_VAZIO allowed)
        run: bash scripts/raf_watt_proxy_probe.sh

      - name: Upload watt-proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watt-proxy-report
          path: ci/reports/watt-proxy.md
          if-no-files-found: warn

      - name: Falsifiability P(k) gate
        run: |
          python3 scripts/first_test_pk.py \
            --data data/pk_observado.csv \
            --output results/first_test_report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('results/first_test_report.json').read_text(encoding='utf-8'))
          verdict = report['verdict']
          assert verdict in {'PASS', 'FAIL'}
          print('P(k) verdict:', verdict)
          if verdict == 'FAIL':
              raise SystemExit('P(k) gate FAIL')
          PY

      - name: Try APKc debug signing proof
        run: bash scripts/apkc_sign_debug.sh

      - name: Upload TOKEN_VAZIO validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-vazio-validation-${{ github.run_id }}
          path: ci/reports/token-vazio-validation.json
          if-no-files-found: warn

      - name: Upload APKc proof and HOTFIX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkc-proofs-and-hotfix-${{ github.run_id }}
          path: |
            Apkc/proofs/out/
            ci/reports/language-freestanding-contract.md
            ci/contracts/apkc_compiler_station_v2.json
          if-no-files-found: warn

      - name: Upload clean-proof-run snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkc-proof-runs
          path: Apkc/proofs/runs/
          if-no-files-found: warn
