name: BITRAF EV3 PNA source-scoped falsifiers (no promotion)

on:
  pull_request:
    paths:
      - 'rafaelia/bitraf_evidence_planes_v1.h'
      - 'tests/bitraf_evidence_planes_v1_test.c'
      - 'tests/bitraf_evidence_planes_v1_freestanding.c'
      - 'docs/BITRAF_EV3_PNA_FIAT_BRIDGE_20261030_V1.md'
      - '.github/workflows/bitraf-ev3-pna.yml'

permissions:
  contents: read

jobs:
  exact_head_scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'EXACT_HEAD=%s\n' "$EXPECTED_HEAD"
          git hash-object rafaelia/bitraf_evidence_planes_v1.h
          git hash-object tests/bitraf_evidence_planes_v1_test.c
          git hash-object tests/bitraf_evidence_planes_v1_freestanding.c
      - name: Compile and run GCC and Clang hosted falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/bitraf_evidence_planes_v1_test.c -o /tmp/raf_ev3_cc
          clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/bitraf_evidence_planes_v1_test.c -o /tmp/raf_ev3_clang
          /tmp/raf_ev3_cc > /tmp/raf_ev3_cc.receipt
          /tmp/raf_ev3_clang > /tmp/raf_ev3_clang.receipt
          cmp /tmp/raf_ev3_cc.receipt /tmp/raf_ev3_clang.receipt
          grep -Fx 'RAFAELIA_EV3=PASS_LOCAL_SCOPED' /tmp/raf_ev3_cc.receipt
          grep -Fx 'BASE=8000 CORE=4096 SHELL=3904 W20_ROUNDTRIP=256000 SINGLE_FLIPS=20' /tmp/raf_ev3_cc.receipt
          grep -Fx 'PNA_STATES=8 DOUBLE_FLIP_COUNTEREXAMPLE=OBSERVED' /tmp/raf_ev3_cc.receipt
          grep -Fx 'CLAIM_ALLOWED=false CI=TOKEN_VAZIO ARM32_DEVICE=TOKEN_VAZIO' /tmp/raf_ev3_cc.receipt
          sha256sum /tmp/raf_ev3_cc.receipt /tmp/raf_ev3_clang.receipt
      - name: Compile freestanding ARMv7 object and forbid undefined imports
        shell: bash
        run: |
          set -euo pipefail
          clang --target=armv7-none-eabi -march=armv7-a -mfloat-abi=soft \
            -std=c11 -O2 -Wall -Wextra -Werror -pedantic -ffreestanding \
            -fno-builtin -fno-stack-protector -nostdlib -c \
            tests/bitraf_evidence_planes_v1_freestanding.c -o /tmp/raf_ev3_arm32.o
          readelf -h /tmp/raf_ev3_arm32.o | grep -E 'Machine:.*ARM'
          if [ -n "$(nm -u /tmp/raf_ev3_arm32.o)" ]; then
            echo 'FAIL_UNDEFINED_ARM32_SYMBOLS'
            nm -u /tmp/raf_ev3_arm32.o
            exit 1
          fi
          sha256sum /tmp/raf_ev3_arm32.o
      - name: Preserve remaining evidence gaps
        run: |
          echo 'PASS_SCOPED: host source falsifiers and ARMv7 object, if previous steps succeeded'
          echo 'TOKEN_VAZIO: physical ARM device, production, ECC, event ledger, independent review'
          echo 'claim_allowed=false; do not promote from this workflow'
