name: RafPictures V1 Contract

on:
  push:
    paths:
      - 'RafPictures/**'
      - '.github/workflows/rafpictures-v1.yml'
  pull_request:
    paths:
      - 'RafPictures/**'
      - '.github/workflows/rafpictures-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafpictures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python stdlib syntax and contract tests
        run: |
          python3 -m compileall -q RafPictures/rafpictures
          cd RafPictures
          python3 -m unittest discover -s tests -v
      - name: Compile and exercise freestanding C signature header
        shell: bash
        run: |
          cat > /tmp/rafp_smoke.c <<'C'
          #include "rafpictures_sniff.h"
          int main(void) {
              const unsigned char png[] = {137,80,78,71,13,10,26,10};
              const unsigned char jpg[] = {255,216,255,0};
              const unsigned char zip[] = {80,75,3,4};
              if (rafp_detect(png, sizeof(png)) != RAFP_PNG) return 1;
              if (rafp_detect(jpg, sizeof(jpg)) != RAFP_JPEG) return 2;
              if (rafp_detect(zip, sizeof(zip)) != RAFP_ZIP_CANDIDATE) return 3;
              if (rafp_detect((const unsigned char *)0, 0) != RAFP_UNKNOWN) return 4;
              return 0;
          }
          C
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I RafPictures/include /tmp/rafp_smoke.c -o /tmp/rafp_smoke
          /tmp/rafp_smoke
