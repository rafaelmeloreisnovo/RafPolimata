name: signed-area-geometry

on:
  pull_request:
    paths:
      - 'tools/signed_area_geometry.py'
      - 'tests/test_signed_area_geometry.py'
      - '.github/workflows/signed-area-geometry.yml'
  push:
    branches:
      - 'math/signed-area-triangulation-v1'
    paths:
      - 'tools/signed_area_geometry.py'
      - 'tests/test_signed_area_geometry.py'
      - '.github/workflows/signed-area-geometry.yml'

permissions:
  contents: read

jobs:
  stdlib-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-check
        run: python tools/signed_area_geometry.py
      - name: Unit tests
        run: python -m unittest tests/test_signed_area_geometry.py -v
