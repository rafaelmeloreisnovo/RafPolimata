name: Freestanding L0

on:
  pull_request:
    paths:
      - 'freestanding/**'
      - 'tools/rafbbs/**'
      - 'syscall/**'
      - 'Benchmark/raf_sys.h'
      - 'Benchmark/raf_bench.h'
      - 'Benchmark/raf_main.c'
      - 'Benchmark/build2.sh'
      - 'Benchmark/Readme.md'
      - 'scripts/verify_execution_boundaries.sh'
      - 'docs/canonical/2026-09-23/RUNTIME_AND_TARGETS.md'
      - 'Makefile'
      - '.github/workflows/freestanding-l0.yml'
  push:
    branches: [main]
    paths:
      - 'freestanding/**'
      - 'tools/rafbbs/**'
      - 'syscall/**'
      - 'Benchmark/raf_sys.h'
      - 'Benchmark/raf_bench.h'
      - 'Benchmark/raf_main.c'
      - 'Benchmark/build2.sh'
      - 'Benchmark/Readme.md'
      - 'scripts/verify_execution_boundaries.sh'
      - 'docs/canonical/2026-09-23/RUNTIME_AND_TARGETS.md'
      - 'Makefile'
      - '.github/workflows/freestanding-l0.yml'

permissions:
  contents: read

concurrency:
  group: freestanding-l0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-isa-zero-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchain
        run: clang --version
      - name: Freestanding source contract
        run: sh freestanding/tests/verify_contract.sh
      - name: Authorial zero-dependency V1
        run: sh freestanding/tests/verify_authorial_zero_dep.sh
      - name: Freestanding six-ISA compile matrix
        run: sh freestanding/tests/verify_matrix.sh
      - name: Fixed-vector ABI/ISA profiles
        run: sh freestanding/tests/verify_profiles.sh
      - name: IBM z/s390x high-vector executor
        run: sh freestanding/tests/verify_s390x_vector.sh
      - name: Scalable-vector ABI/ISA profiles
        run: sh freestanding/tests/verify_scalable.sh
      - name: Matrix-register ABI/ISA profiles
        run: sh freestanding/tests/verify_matrix_accel.sh
      - name: Additional register topology metadata
        run: sh freestanding/tests/verify_register_metadata.sh
      - name: Raw Linux syscall six-ISA compile matrix
        run: sh syscall/tests/verify_matrix.sh
      - name: Execution-layer terminology and boundary audit
        run: sh scripts/verify_execution_boundaries.sh
      - name: Benchmark ARM32 full-TU compile and hidden-helper audit
        run: |
          clang -target armv7a-linux-gnueabi -march=armv7-a -mfloat-abi=softfp -mfpu=neon \
            -O2 -ffreestanding -fno-builtin -fno-stack-protector \
            -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -I Benchmark -c Benchmark/raf_main.c -o "$RUNNER_TEMP/raf_benchmark_a32.o"
          NM_TOOL="$(command -v llvm-nm || command -v nm)"
          test -n "$NM_TOOL"
          UNDEF="$("$NM_TOOL" -u "$RUNNER_TEMP/raf_benchmark_a32.o")"
          test -z "$UNDEF"
          readelf -h "$RUNNER_TEMP/raf_benchmark_a32.o" | grep -F 'Machine:' | grep -E 'ARM|Arm'
      - name: No-libc userspace x86-64 build and runtime smoke
        run: |
          cd Benchmark
          bash build2.sh
          ./raf_enterprise_x64 > "$RUNNER_TEMP/raf-benchmark.out"
          grep -F 'RAFAELIA ENTERPRISE NO-LIBC USERSPACE' "$RUNNER_TEMP/raf-benchmark.out"
          grep -F 'physical bare-metal | TOKEN_VAZIO' "$RUNNER_TEMP/raf-benchmark.out"
          test -z "$(nm -u raf_enterprise_x64)"
          ! readelf -l raf_enterprise_x64 | grep -q 'INTERP'
