name: T7 Workflow V1

on:
  pull_request:
    paths:
      - 'docs/SPEC_T7_TOROID_CONVERGENCE.md'
      - 'configs/t7-workflow-v1.json'
      - 'scripts/validate_t7_workflow_v1.py'
      - 'rafaelia/t7_workflow_projection_v1.h'
      - 'tests/test_t7_workflow_projection_v1.c'
      - '.github/workflows/t7-workflow-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t7-workflow-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate T7 formal contract
        run: python3 scripts/validate_t7_workflow_v1.py
      - name: Verify implementation constants
        run: |
          grep -q '#define T7_DIM       7' Benchmark/raf_types.h
          grep -q '#define T7_MOD       65536U' Benchmark/raf_types.h
      - name: Verify implementation anchors
        run: |
          grep -q 't7_map_input' Benchmark/raf_toroid.h
          grep -q 't7_step' Benchmark/raf_toroid.h
          grep -q 'phi_attractor' Apkc/coherence.h
          grep -q 't7wf_project_v1' rafaelia/t7_workflow_projection_v1.h
      - name: Pi_wf V1 hosted regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I. tests/test_t7_workflow_projection_v1.c -o /tmp/t7wf-test
          /tmp/t7wf-test
      - name: Pi_wf V1 freestanding syntax matrix
        run: |
          clang -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -I. -c tests/test_t7_workflow_projection_v1.c -o /tmp/t7wf-x64.o
          clang -target armv7-none-eabi -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -I. -c tests/test_t7_workflow_projection_v1.c -o /tmp/t7wf-armv7.o
          clang -target aarch64-none-elf -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -I. -c tests/test_t7_workflow_projection_v1.c -o /tmp/t7wf-aarch64.o
