name: Contextual Relational Tensor v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/contextual_relational_tensor.py"
      - "examples/wine-formula-relational-tensor.v1.json"
      - "tests/test_contextual_relational_tensor.py"
      - "docs/CONTEXTUAL_RELATIONAL_TENSOR_V1.md"
      - ".github/workflows/contextual-relational-tensor-v1.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python3 -m unittest tests.test_contextual_relational_tensor
      - name: Evaluate bounded fixture
        run: |
          mkdir -p artifacts
          python3 scripts/contextual_relational_tensor.py \
            examples/wine-formula-relational-tensor.v1.json \
            --out artifacts/contextual-relational-result.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextual-relational-tensor-v1
          if-no-files-found: error
          path: artifacts/contextual-relational-result.json
