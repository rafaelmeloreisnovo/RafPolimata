name: Conversation Pair Binder

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/conversation_pair_binder.py"
      - "tests/test_conversation_pair_binder.py"
      - ".github/workflows/conversation-pair-binder.yml"
  pull_request:
    paths:
      - "scripts/conversation_pair_binder.py"
      - "tests/test_conversation_pair_binder.py"
      - ".github/workflows/conversation-pair-binder.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run binder tests
        run: python3 -m unittest tests.test_conversation_pair_binder
