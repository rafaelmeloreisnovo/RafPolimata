name: RAFDB bounded C11 contract
on:
  pull_request:
    paths:
      - 'RAFDB/**'
      - '.github/workflows/rafdb-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bounded core and SQL subset
        run: sh RAFDB/tests/run.sh
