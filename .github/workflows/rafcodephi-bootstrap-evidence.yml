name: RAFCODEPHI Bootstrap Evidence Contract

on:
  push:
    branches: [main]
    paths:
      - 'contracts/rafcodephi-bootstrap-evidence.v1.schema.json'
      - 'scripts/validate_rafcodephi_bootstrap_evidence.py'
      - 'tests/test_rafcodephi_bootstrap_evidence.py'
      - '.github/workflows/rafcodephi-bootstrap-evidence.yml'
  pull_request:
    paths:
      - 'contracts/rafcodephi-bootstrap-evidence.v1.schema.json'
      - 'scripts/validate_rafcodephi_bootstrap_evidence.py'
      - 'tests/test_rafcodephi_bootstrap_evidence.py'
      - '.github/workflows/rafcodephi-bootstrap-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --disable-pip-version-check pytest
      - run: python3 -m pytest -q tests/test_rafcodephi_bootstrap_evidence.py
