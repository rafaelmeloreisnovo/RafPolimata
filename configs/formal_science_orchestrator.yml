semantic_bridge:
  source_state: METAPHOR
  target_minimum_state: FORMALIZED
  requires:
    - typed_domain
    - units_or_justified_dimensionless
    - empirical_adapter
    - falsifier
    - uncertainty_budget
  forbidden_edge: SEMANTICALLY_RELATED=>CAUSES_PHYSICAL_EFFECT

number_theory_policy:
  allowed_roles:
    - hashing
    - coprime_traversal
    - sampling
    - cycle_detection
  forbidden_claim: prime_number_is_physical_mechanism_without_adapter

time_model:
  wall_clock: UTC_NTP
  duration_clock: MONOTONIC
  secure_sync: NTS_WHEN_AVAILABLE
  required_metrics:
    - offset
    - delay
    - jitter
    - dispersion
    - clock_source
    - uncertainty

proof_gates:
  - G-DIM
  - G-DOM
  - G-NUM
  - G-TIME
  - G-DATA
  - G-UNC
  - G-STAT
  - G-PHYS
  - G-SAFE
  - G-SEM
  - G-REP
  - G-CLAIM
