<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-labelledby="title desc">
  <title id="title">RAFAELIA Operational Gate Seal</title>
  <desc id="desc">Evidence-state seal for local gates: PASS, FAILSAFE, FAILOVER and ROLLBACK. Not a certification mark.</desc>
  <rect width="360" height="120" rx="18" fill="#07111f"/>
  <circle cx="60" cy="60" r="42" fill="#123f7a" stroke="#38bdf8" stroke-width="4"/>
  <path d="M60 22 L70 50 L100 50 L76 68 L86 98 L60 80 L34 98 L44 68 L20 50 L50 50 Z" fill="#facc15"/>
  <path d="M136 30 H326" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
  <path d="M136 60 H300" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M136 90 H274" stroke="#a78bfa" stroke-width="8" stroke-linecap="round"/>
  <text x="120" y="28" fill="#e5f0ff" font-family="monospace" font-size="14">RAFAELIA</text>
  <text x="120" y="56" fill="#e5f0ff" font-family="monospace" font-size="13">PASS | FAILSAFE</text>
  <text x="120" y="84" fill="#e5f0ff" font-family="monospace" font-size="13">FAILOVER | ROLLBACK</text>
  <text x="120" y="106" fill="#94a3b8" font-family="monospace" font-size="10">local evidence seal - no certification claim</text>
</svg>
